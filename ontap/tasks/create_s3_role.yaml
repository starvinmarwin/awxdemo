- name: Create S3 user1
  netapp.ontap.na_ontap_s3_users:
    state: present
    name: user1
    vserver: "{{ item }}"
  loop: "{{ vserver_groups[target_environment] }}"

- name: Create S3 user2
  netapp.ontap.na_ontap_s3_users:
    state: present
    name: user2
    vserver: "{{ item }}"
  loop: "{{ vserver_groups[target_environment] }}"


- name: Create S3 policy on SVMs
  netapp.ontap.na_ontap_s3_policies:
    state: present
    name: health-check-policy
    comment: Created by Ansible "{{ lookup('ansible.builtin.pipe', 'date +%Y-%m-%d') }}"
    vserver: "{{ item }}"
    statements:
      - sid: 1
        resources:
          - "martin-demo-bucket"
          - "martin-demo-bucket/*"
        actions:
          - "ListBucket"
          - "GetObject"
        effect:
          allow
  loop: "{{ vserver_groups[target_environment] }}"
 
- name: Create S3 group on SVMs for Prod
  netapp.ontap.na_ontap_s3_groups:
    state: present
    name: martin-demo-group-prod
    comment: Created by Ansible "{{ lookup('ansible.builtin.pipe', 'date +%Y-%m-%d') }}"
    vserver: "{{ item }}"
    users:
      - name: user1
      - name: user2
    policies:
      - name: martin-demo-policy-prod
  loop: "{{ vserver_groups[target_environment] }}"
  when: target_environment in ['prod']
 
- name: Create S3 group on SVMs for Test
  netapp.ontap.na_ontap_s3_groups:
    state: present
    name: martin-demo-group-test
    comment: Created by Ansible "{{ lookup('ansible.builtin.pipe', 'date +%Y-%m-%d') }}"
    vserver: "{{ item }}"
    users:
      - name: user1
      - name: user2
      - name: user3

    policies:
      - name: martin-demo-policy-test
  loop: "{{ vserver_groups[target_environment] }}"
  when: target_environment in ['test', 'dev']
 
